# Basic example of a GitHub Actions workflow that builds a Shiny app and deploys
# it to GitHub Pages.
#
# The agreed upon contract is:
#
# - Inspect the app directory (`app-dir`, default: the repo root) for package
#   dependencies
# - Install R and the found packages
# - Export the Shiny app directory to `./site`
# - On push events, deploy the exported app to GitHub Pages
#
# If this contract is not met or could be easily improved for others,
# please open a new Issue https://github.com/posit-dev/r-shinylive/
#
# The _magic_ of this workflow is in the `shinylive::export()` function, which
# creates a static version of the Shiny app into the folder `./site`.
# The exported app folder is then uploaded and deployed to GitHub Pages.
#
# When deploying to GitHub Pages, be sure to have the appropriate write
# permissions for your token (`pages` and `id-token`).

name: Deploy app

on:
  workflow_call:
    inputs:
      cache-version:
        type: string
        default: "1"
        required: false
      app-dir:
        description: "Directory containing the Shiny app (`app.R`), relative to the repo root."
        type: string
        default: "."
        required: false
      shinylive-version:
        description: "The shinylive R package to install, as a {pak} reference. For example: `shinylive` (CRAN), `shinylive@0.5.0` (a CRAN version) or `posit-dev/r-shinylive` (GitHub)."
        type: string
        # TODO: Change to `shinylive` (CRAN) after the next CRAN release.
        # Listed in `release_bullets()` (R/release.R).
        default: "posit-dev/r-shinylive"
        required: false
      assets-version:
        description: "The shinylive web assets version to export with, for example `0.10.16`. Leave empty to use the default of the installed shinylive R package."
        type: string
        default: ""
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      APP_DIR: ${{ inputs.app-dir }}
      ASSETS_VERSION: ${{ inputs.assets-version }}

    steps:
      - uses: actions/checkout@v4

      - uses: rstudio/shiny-workflows/setup-r-package@v1
        with:
          packages: |
            renv
            ${{ inputs.shinylive-version }}
            sessioninfo
          cache-version: ${{ inputs.cache-version }}

      - name: Find package dependencies
        shell: Rscript {0}
        id: packages
        run: |
          # Find package dependencies using {renv} and install with {pak}
          pak::pak(
            unique(renv::dependencies(Sys.getenv("APP_DIR"))$Package)
          )

      - name: Build site
        shell: Rscript {0}
        run: |
          assets_version <- Sys.getenv("ASSETS_VERSION")
          if (!nzchar(assets_version)) {
            # Use the installed shinylive's default assets version
            assets_version <- NULL
          } else if (assets_version != shinylive::assets_version()) {
            # Shown as a warning on the workflow run's summary page
            cat(
              "::warning title=shinylive assets version::",
              "Exporting with shinylive assets v", assets_version,
              ", but the installed shinylive R package (v",
              as.character(utils::packageVersion("shinylive")),
              ") uses assets v", shinylive::assets_version(),
              ". Remove the `assets-version` input to use the package's ",
              "assets, or change `shinylive-version` to a matching package.\n",
              sep = ""
            )
          }
          shinylive::export(
            Sys.getenv("APP_DIR"),
            "site",
            assets_version = assets_version
          )

      - name: Upload site artifact
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
